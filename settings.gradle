pluginManagement {
    repositories {
        mavenLocal()
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'packai'

// NeoForge 1.21.1 (Gradle 9 + ModDev). Forge 1.19.2 uses its own wrapper — see docs/VERSIONS.md
include 'neoforge-1.21.1'
project(':neoforge-1.21.1').projectDir = file('neoforge/1.21.1')
